<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNGSHIN WOMEN'S UNIVERSITY · Mongolian Student Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#36255C;--paper:#EFEFF4;--card:#fff;--line:#D2C3F6;--sun:#D2C3F6;--blue:#36255C;--mute:#5d5575}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "Noto Sans","Noto Sans KR",system-ui,sans-serif}
header{background:#fff;color:var(--ink);border-bottom:4px solid var(--sun);position:sticky;top:0;z-index:5}
.bar{max-width:980px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer;background:none;border:0;font-family:inherit;font-size:16px;text-align:left}
.brand img{height:60px;width:auto}
.brand span{display:flex;flex-direction:column;line-height:1.3}
.brand small{font-weight:400;color:var(--mute);font-size:13px}
.lang{margin-left:auto;display:flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:var(--ink);padding:6px 12px;font:600 14px inherit;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:980px;margin:auto;padding:32px 20px 64px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.2;margin:0 0 12px;font-weight:800;max-width:20ch}
.lead{color:var(--mute);max-width:62ch;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sun);border-radius:10px;padding:18px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tile:hover{border-left-color:var(--blue);transform:translateY(-2px);transition:.15s}
.tile b{display:block;font-size:18px;margin-bottom:4px}
.tile span{color:var(--mute);font-size:14px}
.back{background:none;border:0;color:var(--blue);font:600 15px inherit;cursor:pointer;padding:0;margin-bottom:16px}
h2{font-size:22px;margin:36px 0 12px}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol.steps li{counter-increment:s;position:relative;padding:0 0 18px 48px;border-left:2px solid var(--line);margin-left:15px}
ol.steps li::before{content:counter(s);position:absolute;left:-17px;top:0;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600}
.doc{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.doc summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:center}
.doc summary::-webkit-details-marker{display:none}
.doc input{width:20px;height:20px;accent-color:var(--blue);flex:none}
.doc .ko{color:var(--blue);font-weight:600;margin-left:6px}
.doc .more{margin-left:auto;color:var(--mute);font-size:13px;flex:none}
.doc[open] .more{color:var(--blue)}
.doc p{margin:0;padding:0 14px 14px 46px;color:var(--mute)}
.note{background:#f4effd;border:1px solid var(--sun);border-radius:10px;padding:12px 14px;margin-top:20px}
.links a{color:var(--blue);margin-right:16px;font-weight:600}
footer{max-width:980px;margin:auto;padding:0 20px 40px;color:var(--mute);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

let lang="mn";
try{lang=localStorage.getItem("lang")||"mn"}catch(e){}
const L=a=>a[lang==="mn"?0:1];
function setLang(l){lang=l;try{localStorage.setItem("lang",l)}catch(e){};render()}
function go(h){location.hash=h;render()}
function checked(k){try{return localStorage.getItem("c-"+k)==="1"}catch(e){return false}}
function check(k,v){try{localStorage.setItem("c-"+k,v?"1":"0")}catch(e){}}
function render(){
  document.documentElement.lang=lang;
  document.getElementById("brand").innerHTML="<b>SUNGSHIN WOMEN'S UNIVERSITY</b><small>"+L(UI.brand)+"</small>";
  document.getElementById("b-mn").setAttribute("aria-pressed",lang==="mn");
  document.getElementById("b-en").setAttribute("aria-pressed",lang==="en");
  document.getElementById("foot").innerHTML='<div class="links"><b>'+L(UI.links)+':</b> <a href="https://www.hikorea.go.kr" target="_blank" rel="noopener">HiKorea</a><a href="https://www.nhis.or.kr" target="_blank" rel="noopener">NHIS</a></div><p>'+L(UI.disc)+'</p>';
  const id=location.hash.slice(1),t=T[id],app=document.getElementById("app");
  if(!t){
    app.innerHTML='<h1>'+L(UI.title)+'</h1><p class="lead">'+L(UI.lead)+'</p><div class="grid">'+
      Object.keys(T).map(k=>'<button class="tile" onclick="go(\''+k+'\')"><b>'+L(T[k].h)+'</b><span>'+T[k].s[lang==="mn"?0:1]+'</span></button>').join("")+'</div>';
    return;
  }
  app.innerHTML='<button class="back" onclick="go(\'\')">'+L(UI.back)+'</button><h1>'+L(t.h)+'</h1><p class="lead">'+L(t.i)+'</p>'+
    '<h2>'+L(UI.steps)+'</h2><ol class="steps">'+t.st.map(s=>'<li>'+L(s)+'</li>').join("")+'</ol>'+
    '<h2>'+L(UI.docs)+'</h2>'+t.d.map(k=>{const d=D[k],key=id+"-"+k;
      return '<details class="doc"><summary><input type="checkbox" '+(checked(key)?"checked":"")+' onclick="event.stopPropagation();check(\''+key+'\',this.checked)" aria-label="done"><span>'+L(d.n)+'<span class="ko">'+d.ko+'</span></span><span class="more">'+L(UI.tap)+'</span></summary><p>'+L(d.t)+'</p></details>'}).join("")+
    '<div class="note"><b>'+L(UI.tip)+':</b> '+L(t.n)+'</div>';
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
</script>
